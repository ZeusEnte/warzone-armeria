name: Actualizar meta y publicar

on:
  schedule:
    # 06:10 UTC todos los dias (08:10 en Espana peninsular en verano).
    - cron: "10 6 * * *"
  push:
    branches: [main]
    # Un push solo republica la web con el codigo nuevo: NO vuelve a raspar
    # wzstats. Ademas de ahorrar ~70 peticiones, evita que el diff del dia se
    # recalcule contra la pasada de hace diez minutos y "Movimientos del meta"
    # se quede vacio hasta manana.
    paths-ignore:
      - "**.md"
      - "documentacion/**"
      - "_CUARENTENA/**"
  workflow_dispatch:

# Minimo por defecto: cada job pide abajo solo lo que usa. Asi ni el
# despliegue ni el aviso pueden escribir en el repositorio.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # write porque el bot comitea meta.json; pages/id-token, para preparar y
    # subir el artefacto de Pages.
    permissions:
      contents: write
      pages: write
      id-token: write
    # ~70 peticiones a 45 s de espera cada una: 20 minutos es de sobra.
    # Sin esto, un wzstats que responde a medias ocupa el runner 6 horas y
    # bloquea el grupo de concurrencia, asi que manana tampoco se publica.
    timeout-minutes: 20
    outputs:
      avisos: ${{ steps.revisar.outputs.avisos }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      # Rapidas y sin red: si el parser esta roto, mejor enterarse antes de
      # lanzar 70 peticiones contra wzstats.
      - name: Pruebas del scraper
        run: python scripts/pruebas.py

      # El scraper sale con codigo 1 si no pudo leer ningun modo, y en ese caso
      # NO toca meta.json: la web sigue sirviendo el ultimo dato bueno. Si falla
      # solo algun modo, conserva el dato anterior de ese modo y lo anota en
      # "warnings".
      - name: Raspar la meta
        if: github.event_name != 'push'
        run: python scripts/scrape.py

      # Un JSON sintacticamente valido pero con basura dentro se publicaria sin
      # que nadie se entere. Esto lo para antes del commit.
      - name: Validar el JSON generado
        run: python scripts/validar_meta.py

      - name: Guardar cambios
        if: github.event_name != 'push'
        run: |
          git config user.name "meta-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- docs/data/meta.json; then
            echo "La meta no ha cambiado hoy."
          else
            git add docs/data/meta.json
            git commit -m "meta: actualizacion $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Revisar avisos del scraper
        id: revisar
        # OJO: solo la linea "avisos=" va a GITHUB_OUTPUT. Si se redirige todo
        # el script, las lineas "::warning::" caen tambien ahi, no tienen
        # formato clave=valor y el paso revienta -> "deploy" no corre y la web
        # NO se republica, justo el dia que hubo un fallo de raspado.
        run: |
          python - <<'PY'
          import json, os, pathlib
          d = json.loads(pathlib.Path("docs/data/meta.json").read_text(encoding="utf-8"))
          avisos = d.get("warnings") or []
          for a in avisos:
              # El texto viene de fuera: sin saltos de linea no puede colar
              # ordenes ::...:: propias en el registro.
              limpio = " ".join(str(a).splitlines())
              print(f"::warning::{limpio}")
          # json.dumps siempre sale en una linea, asi que la salida es segura.
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              print("avisos=" + json.dumps(avisos, ensure_ascii=False), file=f)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Va DESPUES de desplegar a proposito: si un modo se cayo, la web se publica
  # igual con el dato conservado, pero la ejecucion queda en rojo y GitHub manda
  # el correo. Si esto fuera un paso de "build", el fallo impediria publicar.
  avisar:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # OJO, esto es lo que hace que el aviso llegue de verdad. Sin "always()"
    # este job se SALTA cuando "deploy" no acaba en success, que es justo el
    # dia en que hay algo que contar. Y un run "cancelled" no genera correo de
    # GitHub: solo lo generan los "failure". Resultado el 2026-09-10: el cron
    # rasco y comiteo bien, "deploy" agoto sus 10 minutos contra Pages, el run
    # quedo en "cancelled", este job se salto y NADIE se entero de que la web
    # se habia quedado con los datos del dia anterior. Con always() el job
    # corre igual y falla, y entonces si sale el correo.
    if: always()
    # Solo lee salidas de los jobs anteriores: no necesita nada.
    permissions: {}
    steps:
      # Primero lo del despliegue: si la web no se ha republicado, da igual que
      # el raspado fuera perfecto, porque nadie lo esta viendo.
      - name: Fallar si el despliegue no salio bien
        env:
          ESTADO_BUILD: ${{ needs.build.result }}
          ESTADO_DEPLOY: ${{ needs.deploy.result }}
        run: |
          if [ "$ESTADO_BUILD" != "success" ]; then
            echo "::error::El job 'build' termino en '$ESTADO_BUILD': no hay nada publicado hoy."
            exit 1
          fi
          if [ "$ESTADO_DEPLOY" != "success" ]; then
            echo "::error::El job 'deploy' termino en '$ESTADO_DEPLOY'. Los datos de hoy estan en main pero la web sigue sirviendo los del dia anterior."
            echo "Si pone 'cancelled', lo normal es que Pages tardara mas que el timeout-minutes de 'deploy'."
            echo "Se arregla relanzando el workflow a mano (Actions -> Run workflow): no vuelve a raspar, solo publica lo que ya hay en main."
            exit 1
          fi
          echo "Despliegue correcto: la web sirve los datos de hoy."

      - name: Fallar si el raspado dejo avisos
        env:
          AVISOS: ${{ needs.build.outputs.avisos }}
        run: |
          if [ "$AVISOS" = "[]" ] || [ -z "$AVISOS" ]; then
            echo "Sin avisos: el raspado fue completo."
          else
            echo "El raspado dejo avisos:"
            echo "$AVISOS"
            echo "La web se publico con el dato conservado del dia anterior en esos modos."
            exit 1
          fi
