name: Actualizar meta y publicar

on:
  schedule:
    # 06:10 UTC todos los días (08:10 en España peninsular en verano).
    - cron: "10 6 * * *"
  push:
    branches: [main]
    # Cambiar documentacion no justifica volver a raspar wzstats.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      # El scraper sale con codigo 1 si no pudo leer ningun modo, y en ese caso
      # NO toca meta.json: la web sigue sirviendo el ultimo dato bueno.
      - name: Raspar la meta
        run: python scripts/scrape.py

      - name: Guardar cambios
        run: |
          git config user.name "meta-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- docs/data/meta.json; then
            echo "La meta no ha cambiado hoy."
          else
            git add docs/data/meta.json
            git commit -m "meta: actualizacion $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
